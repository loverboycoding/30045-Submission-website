    <style>
        /* Style for the button container */
        .buttons {
            margin-bottom: 20px;
        }

        /* Style for the buttons */
        .chart-button {
            margin: 5px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

            .chart-button:hover {
                background-color: #45a049;
            }

        /* Styling for the chart's line */
        .line {
            fill: none;
            stroke: slategrey;
            stroke-width: 0.5;
        }
    </style>
